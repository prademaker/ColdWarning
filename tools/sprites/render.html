    g = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.01, p.b - p.a - bev * 2), bevelEnabled: bev > 0.02, bevelThickness: bev, bevelSize: bev * 0.8, bevelSegments: 1 });
    g.translate(0, 0, p.a + bev);
    if (p.plane === 'top') g.rotateX(-Math.PI / 2);       // (x, -y, d) -> (x, d, y)
    else if (p.plane === 'front') g.rotateY(Math.PI / 2); // (-y, z, d) -> (d, z, y)
  }
  return g;
}
function place(obj, p) {
  const pos = p.p || [0, 0, 0];
  obj.position.set(pos[0], pos[2], pos[1]);
  if (p.r) { obj.rotation.order = 'YZX'; obj.rotation.set(p.r[0] * Math.PI / 180, -p.r[2] * Math.PI / 180, p.r[1] * Math.PI / 180); }
}
function buildPrims(list, mats, surf) {
  const g = new THREE.Group();
  for (const p of list) {
    if (p.t === 'grp') { const c = buildPrims(p.c, mats, surf); place(c, p); g.add(c); continue; }
    const geo = primGeometry(p), def = mats[p.m];
    const mesh = new THREE.Mesh(geo, meshMaterial(p.m, def, surf));
    if (p.t !== 'ext') place(mesh, p);
    mesh.castShadow = mesh.receiveShadow = !def.glow;
    // flags live in userData so they survive clone() (the turret is rendered from a clone)
    mesh.userData.flags = { team: def.team ? 1 : 0, camo: def.camo ? 1 : 0, ground: p.ground ? 1 : 0 };
    g.add(mesh);
  }
  return g;
}
// bake every primitive's transform into its geometry, so positions are in model space (the
// weathering noise then sticks to the model) and the part is one flat group
function flatten(g) {
  g.updateMatrixWorld(true);
  const out = new THREE.Group(), meshes = [];
  g.traverse(o => { if (o.isMesh) meshes.push(o); });
  for (const o of meshes) {
    o.geometry.applyMatrix4(o.matrixWorld);
    o.position.set(0, 0, 0); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1);
    out.add(o);
  }
  return out;
}
async function loadMeshModel(cfg) {
  const d = await (await fetch('/mesh/' + cfg.mesh + '.json')).json();
  const root = new THREE.Group();
  // structures get cladding seams, slab joints and rain streaks; their rotating guns do not
  const surf = /^b_/.test(cfg.mesh) && !/_gun$/.test(cfg.mesh) ? 'building' : '';
  const hull = flatten(buildPrims(d.parts.hull, d.mats, surf));
  hull.name = 'hull'; root.add(hull);
  if (d.parts.turret) {
    const t = new THREE.Group(); t.name = 'turret';
    t.add(flatten(buildPrims(d.parts.turret, d.mats, '')));
    t.position.set(d.mount[0], d.mount[2], d.mount[1]);
    root.add(t);
  }
  return root;
}

async function loadVoxModel(cfg) {
  const fetchVox = async f => parseVox(await (await fetch('/vox/' + f)).arrayBuffer());
  const root = new THREE.Group();
  const hull = voxMesh(await fetchVox(cfg.vox.hull), cfg.pivot, cfg.lift || 0);
  hull.name = 'hull'; root.add(hull);
  if (cfg.vox.turret) {
    const t = new THREE.Group(); t.name = 'turret';
    t.add(voxMesh(await fetchVox(cfg.vox.turret), cfg.turretPivot, 0));
    // the turret sits on the hull at mount = [x, y, z] in hull voxels
    t.position.set(cfg.mount[0] - cfg.pivot[0], cfg.mount[2], cfg.mount[1] - cfg.pivot[1]);
    root.add(t);
  }
  return root;
}

function maskMaterials(root, rules, which = 'mask') {
  const saved = new Map();
  root.traverse(o => {
    if (!o.isMesh) return;
    saved.set(o, o.material);
    const mf = o.userData.flags;
    if (mf) { o.material = new THREE.MeshBasicMaterial({ toneMapped: false, color: which === 'mask' && mf.team || which === 'camo' && mf.camo || which === 'ground' && mf.ground ? 0xffffff : 0x000000 }); return; }
    const vc = VOX_COLORS.get(o.geometry);
    if (vc) {
      o.geometry.setAttribute('color', vc[which]);
      o.material = new THREE.MeshBasicMaterial({ vertexColors: true });
      return;
    }
    const m = o.material;
    const rule = rules[m.name] || rules['*'] || 'paint';
    o.material = m.map ? new THREE.MeshBasicMaterial({ map: maskTexture(m.map, rule) })
      : new THREE.MeshBasicMaterial({ color: rule === 'all' ? 0xffffff : 0x000000 });
  });
  return () => saved.forEach((m, o) => { o.material = m; const vc = VOX_COLORS.get(o.geometry); if (vc) o.geometry.setAttribute('color', vc.colors); });
}

async function renderSheet(cfg) {
  const root = cfg.mesh ? await loadMeshModel(cfg) : cfg.vox ? await loadVoxModel(cfg) : (await loader.loadAsync('/models/' + cfg.file)).scene;
  const C = cfg.cell * RES;                 // cell size in pixels
  const s = RES * cfg.k * Math.SQRT2;       // pixels per model unit
  const ay = Math.round(C * (cfg.anchor || 0.66));
  const cam = new THREE.OrthographicCamera(-C / 2 / s, C / 2 / s, ay / s, -(C - ay) / s, -1000, 1000);
  cam.position.copy(VIEW).multiplyScalar(100); cam.lookAt(0, 0, 0);
  renderer.setSize(C, C);

  root.updateMatrixWorld(true);
  for (const name of cfg.hide || []) root.getObjectByName(name).visible = false;
  const NF = cfg.facings || FACINGS, NC = Math.min(COLS, NF), NR = Math.ceil(NF / NC);
  const meta = { cell: cfg.cell, cols: NC, facings: NF, res: RES, ax: cfg.cell / 2, ay: ay / RES, parts: {}, style: cfg.vox || cfg.mesh ? 'voxel' : 'model' };
  const turretNode = cfg.turret ? root.getObjectByName(cfg.turret) : null;
  if (cfg.rotor && typeof cfg.rotor === 'object') meta.rotor = { z: cfg.rotor.z * cfg.k, r: cfg.rotor.r * cfg.k };
  else if (cfg.rotor) {
    const blade = root.getObjectByName(cfg.rotor);
    const box = new THREE.Box3().setFromObject(blade), size = box.getSize(new THREE.Vector3());
    meta.rotor = { z: box.max.y * cfg.k, r: Math.max(size.x, size.z) / 2 * cfg.k };
  }

  const parts = { hull: root };
  if (turretNode) {
    // render the turret on its own, pivot at the origin but at its real height
    const wp = turretNode.getWorldPosition(new THREE.Vector3());
    turretNode.visible = false;
    const t = turretNode.clone(); t.visible = true;
    t.position.set(0, wp.y, 0);
    const g = new THREE.Group(); g.add(t);
    parts.turret = g;
    meta.turretOffset = (cfg.vox || cfg.mesh ? wp.x : wp.z) * cfg.k; // forward offset of the turret pivot from the hull pivot (world px)
  }

  const out = {};
  for (const [part, obj] of Object.entries(parts)) {
    const scene = new THREE.Scene();
    let shadowR = 0;
    if (cfg.mesh) { const sph = new THREE.Box3().setFromObject(root).getBoundingSphere(new THREE.Sphere()); shadowR = sph.radius + sph.center.length() + 2; }
    lights(scene, shadowR);
    if (cfg.mesh && !window.NOENV) { scene.environment = ENV; scene.environmentIntensity = SKY ? 0.38 : 0.16; }
    const holder = new THREE.Group(); holder.add(obj); scene.add(holder);
    const sheets = {};
    let comp = null;
    // structures also get a 'ground' sheet marking their concrete slab (weathered to the map in game)
    const groundPass = cfg.mesh && /^b_/.test(cfg.mesh) && !/_gun$/.test(cfg.mesh) ? ['ground'] : [];
    for (const pass of cfg.vox || cfg.mesh ? ['base', 'mask', 'camo', ...groundPass] : ['base', 'mask']) {
      const restore = pass !== 'base' ? maskMaterials(obj, cfg.mask || {}, pass) : () => {};
      const sheet = document.createElement('canvas');
      sheet.width = C * NC; sheet.height = C * NR;
      const sx = sheet.getContext('2d');
      for (let f = 0; f < NF; f++) {
        // game facing a (0 = +x, towards +y) -> rotate the model's forward axis onto it
        // (.glb models face +Z; voxel models face +X)
        holder.rotation.y = (cfg.vox || cfg.mesh ? 0 : Math.PI / 2) - f / NF * Math.PI * 2;
        renderer.render(scene, cam);
        if (cfg.mesh && pass === 'base' && !window.NOAO) {
          // colour from the ambient-occlusion pipeline (drawn over an opaque ground tone),
          // coverage from the plain render
          const alpha = document.createElement('canvas'); alpha.width = alpha.height = C;
          alpha.getContext('2d').drawImage(renderer.domElement, 0, 0);
          renderer.setClearColor(0x5a5a50, 1);
          comp = comp || aoComposer(scene, cam, C);
          comp.render();
          renderer.setClearColor(0x000000, 0);
          const col = document.createElement('canvas'); col.width = col.height = C;
          const cx = col.getContext('2d');
          cx.drawImage(renderer.domElement, 0, 0);
          const cd = cx.getImageData(0, 0, C, C), ad = alpha.getContext('2d').getImageData(0, 0, C, C);
          for (let i = 3; i < cd.data.length; i += 4) cd.data[i] = ad.data[i];
          cx.putImageData(cd, 0, 0);
          sx.drawImage(col, (f % NC) * C, Math.floor(f / NC) * C);
          continue;
        }
        sx.drawImage(renderer.domElement, (f % NC) * C, Math.floor(f / NC) * C);
      }
      restore();
      if (pass !== 'base') {
        // luminance -> alpha, limited by the base sheet's coverage
        const base = sheets.base.getContext('2d').getImageData(0, 0, sheet.width, sheet.height).data;
        const d = sx.getImageData(0, 0, sheet.width, sheet.height), p = d.data;
        for (let i = 0; i < p.length; i += 4) {
          const a = Math.min(p[i], base[i + 3]);
          p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = a;
        }
        sx.putImageData(d, 0, 0);
      }
      sheets[pass] = sheet;
    }
    out[part] = {};
    for (const [pass, c] of Object.entries(sheets)) out[part][pass] = c.toDataURL('image/png');
    if (sheets.camo) meta.camo = true;
    if (sheets.ground) meta.ground = true;
    meta.parts[part] = true;
  }
  return { meta, images: out };
}

window.renderSheet = renderSheet;
if (!new URLSearchParams(location.search).has('plain')) await loadLook();
window.ready = true;
</script>
</body>
</html>
