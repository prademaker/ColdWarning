<!doctype html>
<html>
<body style="margin:0;background:#667">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
// Renders scanned scenery (trees, shrubs, boulders: glTF) into single isometric sprites with a
// separate ground-shadow sprite, in the game's projection and sun.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const RES = 2;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const VIEW = new THREE.Vector3(Math.cos(Math.PI / 6) / Math.SQRT2, 0.5, Math.cos(Math.PI / 6) / Math.SQRT2);
// the game's sun (js/fx.js SUN): shadows fall towards +x, -y in game axes (three: +x, -z)
const SUN = new THREE.Vector3(-0.9, 1.05, 0.3).normalize();
let ENV = null;
const loader = new GLTFLoader();

function trim(canvas, pad = 2) {
  const w = canvas.width, h = canvas.height, d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 6) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  // even sizes, so the half-resolution draw lands on whole pixels
  if ((x1 - x0 + 1) % 2) x1 = Math.min(w - 1, x1 + 1); if ((y1 - y0 + 1) % 2) y1 = Math.min(h - 1, y1 + 1);
  const c = document.createElement('canvas'); c.width = x1 - x0 + 1; c.height = y1 - y0 + 1;
  c.getContext('2d').drawImage(canvas, -x0, -y0);
  return { c, x0, y0 };
}

// cfg: { file, h (game px tall), yaw: [degrees...], tint: [r,g,b] multiplier, snow, sat, pick: node name, flat }
async function renderProp(cfg) {
  if (!ENV) {
    const hdr = await new RGBELoader().loadAsync('/hdri/' + cfg.hdri);
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    ENV = new THREE.PMREMGenerator(renderer).fromEquirectangular(hdr).texture;
  }
  const gltf = await loader.loadAsync('/models/' + cfg.file);
  let root = gltf.scene;
  if (cfg.pick) { const n = root.getObjectByName(cfg.pick); if (n) { root = new THREE.Group(); root.add(n); n.position.set(0, 0, 0); } }
  root.updateMatrixWorld(true);
  const tint = cfg.tint || [1, 1, 1];
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    const m = o.material;
    if (m.map) m.map.anisotropy = 8;
    if (m.transparent || m.alphaTest > 0 || m.alphaMode === 'BLEND') { m.transparent = false; m.alphaTest = 0.4; m.side = THREE.DoubleSide; m.depthWrite = true; }
    m.color.multiply(new THREE.Color(tint[0], tint[1], tint[2]));
    m.envMapIntensity = 1;
    // depth material that respects leaf cut-outs, so shadows are leaf-shaped, not card-shaped
    if (m.alphaTest > 0 && m.map) o.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: m.map, alphaTest: 0.4 });
  });
  const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3());
  const holder = new THREE.Group();
  const k = cfg.h / (cfg.flat ? Math.max(size.x, size.z) : size.y);   // game px per model unit (before the view's own scale)
  // stand on the ground, centred on the trunk: the lowest slice of the model
  let cx = (box.min.x + box.max.x) / 2, cz = (box.min.z + box.max.z) / 2;
  if (!cfg.flat) {
    let sx = 0, sz = 0, n = 0; const v = new THREE.Vector3();
    root.traverse(o => { if (!o.isMesh) return; const p = o.geometry.attributes.position; const step = Math.max(1, Math.floor(p.count / 20000));
      for (let i = 0; i < p.count; i += step) { v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld); if (v.y < box.min.y + size.y * 0.06) { sx += v.x; sz += v.z; n++; } } });
    if (n > 3) { cx = sx / n; cz = sz / n; }
  }
  root.position.set(-cx, -box.min.y - (cfg.sink || 0) * size.y, -cz);
  holder.add(root); holder.scale.setScalar(k);
  const R = Math.max(size.x, size.y, size.z) * k * 1.6 + 8;      // world radius to frame
  const C = Math.ceil(R * 2 * RES * 1.5 / 2) * 2;
  const s = RES * Math.SQRT2;
  const ay = Math.round(C * 0.6);
  const cam = new THREE.OrthographicCamera(-C / 2 / s, C / 2 / s, ay / s, -(C - ay) / s, -4000, 4000);
  cam.position.copy(VIEW).multiplyScalar(1000); cam.lookAt(0, 0, 0);
  renderer.setSize(C, C);

  const scene = new THREE.Scene();
  scene.environment = ENV; scene.environmentIntensity = cfg.env ?? 0.55;
  const sun = new THREE.DirectionalLight(0xfff0d8, cfg.sun ?? 3.0);
  sun.position.copy(SUN).multiplyScalar(R * 3); sun.castShadow = true;
  const sc = sun.shadow.camera; sc.left = sc.bottom = -R * 1.3; sc.right = sc.top = R * 1.3; sc.near = 0.1; sc.far = R * 8;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.3; sun.shadow.radius = 3;
  scene.add(sun);
  if (cfg.snow) { const top = new THREE.DirectionalLight(0xe8f2ff, cfg.snow); top.position.set(0, 1, 0); scene.add(top); }
  scene.add(holder);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(R * 8, R * 8), new THREE.ShadowMaterial({ opacity: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; ground.visible = false; scene.add(ground);

  const snap = () => { const c = document.createElement('canvas'); c.width = c.height = C; c.getContext('2d').drawImage(renderer.domElement, 0, 0); return c; };
  const out = [];
  for (const yaw of cfg.yaw || [0]) {
    holder.rotation.y = yaw * Math.PI / 180;
    ground.visible = false;
    root.traverse(o => { if (o.isMesh) { o.material.colorWrite = true; o.material.depthWrite = true; } });
    renderer.render(scene, cam);
    let col = snap();
    if (cfg.sat != null || cfg.gain != null) {
      const x = col.getContext('2d'), im = x.getImageData(0, 0, C, C), p = im.data, sat = cfg.sat ?? 1, g = cfg.gain ?? 1;
      for (let i = 0; i < p.length; i += 4) { const l = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2]; for (let c = 0; c < 3; c++) p[i + c] = Math.max(0, Math.min(255, (l + (p[i + c] - l) * sat) * g)); }
      x.putImageData(im, 0, 0);
    }
    // the shadow alone: the model still casts but is not drawn
    ground.visible = true;
    root.traverse(o => { if (o.isMesh) { o.material.colorWrite = false; o.material.depthWrite = false; } });
    renderer.render(scene, cam);
    const raw = snap(), sh = document.createElement('canvas'); sh.width = sh.height = C;
    const hx = sh.getContext('2d'); hx.filter = `blur(${RES * 0.8}px)`; hx.drawImage(raw, 0, 0);
    const a = trim(col), b = trim(sh, 4);
    out.push({
      img: a.c.toDataURL('image/png'), w: a.c.width / RES, h: a.c.height / RES, ox: (C / 2 - a.x0) / RES, oy: (ay - a.y0) / RES,
      shadow: b ? b.c.toDataURL('image/png') : null, sw: b ? b.c.width / RES : 0, sh: b ? b.c.height / RES : 0, sox: b ? (C / 2 - b.x0) / RES : 0, soy: b ? (ay - b.y0) / RES : 0,
    });
  }
  scene.remove(holder);
  root.traverse(o => { if (o.isMesh) { o.geometry.dispose(); for (const t of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap']) if (o.material[t]) o.material[t].dispose(); o.material.dispose(); } });
  return out;
}
window.renderProp = renderProp;
window.ready = true;
</script>
</body>
</html>
